[package]
name = "escrow-postgres"
version = "0.1.0"
edition = "2021"
description = "PostgreSQL implementation of escrow-core's Store"

[dependencies]
async-trait = "0.1"
escrow-core = { path = "../escrow-core" }
hex = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
