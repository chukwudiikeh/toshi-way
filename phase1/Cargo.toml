[package]
name = "phase1"
version = "0.1.0"
edition = "2021"
description = "Phase 1: prove the hold-invoice lock -> settle / cancel cycle on regtest"

[dependencies]
anyhow = "1"
hex = "0.4"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
fedimint-tonic-lnd = { version = "0.4", features = ["invoicesrpc", "routerrpc"] }
